<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Berdua</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff3f6;--card:#fff;--tx:#3a2230;--mut:#8a6b78;--bd:#f2cfd9;--p1:#e11d48;--p2:#2563eb;--ac:#ffb3c6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#1b1217;--card:#2b1d25;--tx:#fbeaf0;--mut:#b99aa8;--bd:#4b3441;--p1:#fb7191;--p2:#7db2ff;--ac:#6b3b4f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#1b1217;--card:#2b1d25;--tx:#fbeaf0;--mut:#b99aa8;--bd:#4b3441;--p1:#fb7191;--p2:#7db2ff;--ac:#6b3b4f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:var(--tx);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.w{max-width:520px;margin:auto;padding:16px}
h1{text-align:center;margin:8px 0 2px;font-size:1.8rem}
.sub{text-align:center;color:var(--mut);margin:0 0 14px}
.pl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl input{width:100%;box-sizing:border-box;padding:10px;border-radius:12px;border:2px solid;background:var(--card);color:var(--tx);font:inherit}
#n0{border-color:var(--p1)}#n1{border-color:var(--p2)}
#sc{text-align:center;margin:12px 0;font-size:1.1rem;background:var(--card);border-radius:14px;padding:10px;border:1px solid var(--bd)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px 8px;text-align:center;cursor:pointer}
.m b{display:block;font-size:2rem}.m span{display:block;font-weight:700;margin-top:4px}.m small{color:var(--mut)}
.m:active{transform:scale(.97)}
.bar{display:flex;justify-content:space-between;align-items:center}
.bar h2{margin:0;font-size:1.2rem}
.btn{padding:10px 18px;border-radius:12px;border:0;background:#e11d48;color:#fff;font-weight:700;cursor:pointer}
.btn.l{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
#st{text-align:center;font-weight:700;font-size:1.15rem;min-height:1.6em;margin:12px 0}
#acts{text-align:center;margin-top:16px}
.cell{aspect-ratio:1;border:2px solid var(--bd);border-radius:14px;background:var(--card);font-size:clamp(1.6rem,9vw,2.6rem);cursor:pointer;padding:0}
.g3,.g4,.g7{display:grid;gap:8px;margin:auto}
.g3{grid-template-columns:repeat(3,1fr);max-width:360px}
.g4{grid-template-columns:repeat(4,1fr)}
.g7{grid-template-columns:repeat(7,1fr);gap:4px;background:var(--p2);padding:6px;border-radius:14px;opacity:.95}
.g7 .cell{border-radius:50%;border:0;background:var(--card)}
.hl{outline:4px solid #fbbf24;animation:pl .6s infinite alternate}
@keyframes pl{to{transform:scale(.92)}}
.card{background:var(--ac)}.card.up{background:var(--card)}.card.ok{opacity:.55}
.gp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pad{height:230px;border-radius:20px;border:0;background:var(--card);border:2px solid var(--c);font-size:1.7rem;font-weight:700;cursor:pointer}
.pad small{display:block;color:var(--c);font-size:1rem}
.pad.go{background:#22c55e;color:#fff;border-color:#22c55e}.pad.go small{color:#fff}
.row{display:flex;gap:10px;justify-content:center}
.row .btn{font-size:2.8rem;padding:10px 16px;background:var(--card);border:1px solid var(--bd)}
.rv{font-size:4rem;text-align:center;padding:20px 0}.rv small{font-size:1rem;color:var(--mut)}
.q{min-height:200px;border-radius:20px;background:var(--card);border:2px dashed var(--bd);padding:24px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:1.2rem}
.q small{color:var(--mut);font-weight:700}
.g9{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;background:var(--bd);padding:2px;border-radius:10px;margin:auto}
.g9 .cell{border-radius:4px;border:0;font-size:clamp(.9rem,4.5vw,1.6rem)}
.big{font-size:4rem;text-align:center;padding:12px 0;font-weight:700}
.opt{display:block;width:100%;margin:8px 0;padding:14px;text-align:left}
.pad.hot{background:#ef4444;color:#fff;border-color:#ef4444}.pad.hot small{color:#fff}
:root{--bg:#fff0f5;--card:#fffafc;--tx:#4a2336;--mut:#9a6e82;--bd:#f6cfdd;--p1:#e11d6a;--p2:#7c3aed;--ac:#ffb8d1;--glass:rgba(255,255,255,.72);--gb:rgba(255,255,255,.95);--sh:rgba(225,29,106,.4);--hole:#fff0f6;--g1:#ffd0e2;--g2:#e2d2ff;--g3:#ffe5d3}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#170f1f;--card:#2a1a33;--tx:#fde8f1;--mut:#c4a0b5;--bd:#4d3358;--p1:#ff7aa8;--p2:#b79bff;--ac:#6b3b6f;--glass:rgba(54,34,66,.62);--gb:rgba(255,255,255,.1);--sh:rgba(0,0,0,.55);--hole:#1b1024;--g1:#3d1a3a;--g2:#2a1d52;--g3:#3a2230}}
:root[data-theme="dark"]{--bg:#170f1f;--card:#2a1a33;--tx:#fde8f1;--mut:#c4a0b5;--bd:#4d3358;--p1:#ff7aa8;--p2:#b79bff;--ac:#6b3b6f;--glass:rgba(54,34,66,.62);--gb:rgba(255,255,255,.1);--sh:rgba(0,0,0,.55);--hole:#1b1024;--g1:#3d1a3a;--g2:#2a1d52;--g3:#3a2230}
body{font-family:Quicksand,Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:600;background:radial-gradient(circle at 12% 8%,var(--g1),transparent 45%),radial-gradient(circle at 90% 18%,var(--g2),transparent 45%),radial-gradient(circle at 50% 100%,var(--g3),transparent 55%),var(--bg);background-attachment:fixed}
.w{position:relative;z-index:1}
#hs{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#hs i{position:absolute;bottom:-40px;font-style:normal;opacity:0;animation:fl linear infinite}
@keyframes fl{10%{opacity:.55}100%{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
h1{font-family:"Dancing Script","Brush Script MT",cursive;font-size:clamp(2.4rem,11vw,3.4rem);font-weight:700;margin:6px 0 0;line-height:1.15;background:linear-gradient(90deg,var(--p1),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:0 0 18px}
.m,#sc,.pl input,.q{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--gb);box-shadow:0 12px 32px -16px var(--sh)}
.pl input{border-radius:999px;padding:12px 18px;text-align:center;border:2px solid var(--bd)}
#n0:focus{outline:0;border-color:var(--p1)}#n1:focus{outline:0;border-color:var(--p2)}
#sc{border-radius:999px;padding:10px 16px;margin:14px 0 18px}
.menu{gap:12px}
.m{border-radius:26px;padding:18px 10px;transition:transform .2s,box-shadow .2s;animation:pop .5s both}
.m:nth-child(2n){animation-delay:.08s}.m:nth-child(3n){animation-delay:.16s}
.m:hover{transform:translateY(-4px);box-shadow:0 18px 34px -14px var(--sh)}
.m b{display:inline-flex;align-items:center;justify-content:center;min-width:58px;height:58px;padding:0 14px;border-radius:29px;font-size:1.7rem;margin-bottom:6px;background:linear-gradient(135deg,rgba(255,150,185,.35),rgba(170,130,255,.35))}
.m span{font-size:1.05rem}
.btn{background:linear-gradient(135deg,#ff7aa2,#e8467c);border-radius:999px;padding:11px 22px;box-shadow:0 10px 22px -10px rgba(232,70,124,.8);transition:transform .15s}
.btn:active{transform:scale(.95)}
.btn.l{background:var(--glass);color:var(--tx);border:1px solid var(--gb);box-shadow:none}
.bar h2{font-family:"Dancing Script",cursive;font-size:1.8rem;font-weight:700}
#st{width:fit-content;max-width:100%;margin:14px auto;padding:8px 18px;border-radius:999px;background:var(--glass);font-size:1.05rem}
#st:empty{display:none}
.cell{background:var(--glass);border:1px solid var(--gb);border-radius:20px;box-shadow:0 8px 18px -12px var(--sh);transition:transform .15s}
.cell:hover{transform:translateY(-2px)}
.g9 .cell{border-radius:6px;box-shadow:none}
.g7{background:linear-gradient(145deg,#c4a1ff,#7c3aed);opacity:1;padding:8px;gap:6px;border-radius:24px;box-shadow:0 16px 32px -14px var(--sh)}
.g7 .cell{background:var(--hole);box-shadow:inset 0 3px 6px rgba(0,0,0,.3);border:0;transform:none}
.card{background:linear-gradient(135deg,#ff9ebb,#b794f6);border:0}
.card:not(.up)::after{content:"♥";color:rgba(255,255,255,.85);font-size:1.5rem}
.card.up{background:var(--glass)}
.pad{border-radius:30px;background:var(--glass);box-shadow:0 14px 30px -16px var(--c)}
.row .btn{border-radius:24px;background:var(--glass)}
.opt{border-radius:20px}
.q{border-radius:28px;font-size:1.25rem}
.rv{text-shadow:0 8px 20px var(--sh)}
@media(prefers-reduced-motion:reduce){#hs{display:none}*{animation:none!important}}
.by{text-align:center;margin:0 0 4px;font-size:1rem;color:var(--mut)}.by b{color:var(--p1)}
.ft{text-align:center;color:var(--mut);margin:26px 0 8px;font-size:.95rem}.ft b{background:linear-gradient(90deg,var(--p1),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.m:last-child:nth-child(odd){grid-column:1/-1}
.ft{font-size:.8rem;opacity:.7;margin:22px 0 4px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
#bn{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:55;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;max-width:92vw;padding:10px 14px 10px 20px;border-radius:26px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--gb);box-shadow:0 14px 34px -12px var(--sh);animation:drop .5s cubic-bezier(.2,1.4,.4,1);font-weight:700}
@keyframes drop{from{transform:translate(-50%,-160%)}}
#bn .btn{padding:8px 14px;font-size:.9rem}
#fab{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;z-index:40}
#fab button{width:50px;height:50px;border-radius:50%;border:1px solid var(--gb);background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:1.4rem;cursor:pointer;box-shadow:0 10px 24px -10px var(--sh)}
#md{position:fixed;inset:0;z-index:60;background:rgba(20,8,24,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;padding:16px;overflow:auto}
.mb{max-width:340px;text-align:center}.mb img{width:100%;border-radius:20px;box-shadow:0 20px 50px -16px #000}.mb p{color:#fff;font-size:.85rem}.mb .btn{margin:4px}
.mt{height:16px;border-radius:9px;background:var(--glass);margin:18px 0;overflow:hidden}.mt i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p1),var(--p2));transition:width .1s}
.fld{position:relative;height:340px;display:grid;grid-template-columns:1fr 1fr;border-radius:28px;overflow:hidden;background:var(--glass);user-select:none;box-shadow:0 14px 30px -16px var(--sh)}
.fld>div{position:relative;border-right:2px dashed var(--bd)}.fld>div:last-child{border:0}
.bl{position:absolute;bottom:-60px;font-size:2.6rem;border:0;background:none;padding:0;cursor:pointer;animation:up linear forwards}
@keyframes up{to{transform:translateY(-430px)}}
.bl.pp{animation:pf .25s forwards}
@keyframes pf{to{transform:scale(1.8);opacity:0}}
.tw{position:relative;height:56px;border-radius:28px;background:var(--glass);margin:10px 0 18px;overflow:hidden}
.tw::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--p1),transparent 50%,var(--p2));opacity:.28}
.tw i{position:absolute;z-index:1;top:7px;left:50%;transform:translateX(-50%);font-style:normal;font-size:2.2rem;transition:left .1s}
.coin{width:130px;height:130px;margin:20px auto;border-radius:50%;display:grid;place-items:center;font-size:3.4rem;background:radial-gradient(circle at 30% 30%,#fff3b0,#f5b942);box-shadow:0 14px 30px -10px rgba(245,185,66,.8);transition:transform 1.4s cubic-bezier(.2,.8,.3,1)}
.trk{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.sq{aspect-ratio:1;border-radius:12px;background:var(--glass);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.95rem}
.sq small{font-size:.65rem;color:var(--mut)}.sq b{font-size:1.2rem;min-height:1.2em}
</style></head><body><div id="hs" aria-hidden="true"></div><div id="md" hidden></div><div id="fab"><button id="b1" title="Bagikan gambar">📸</button><button id="b2" title="Suara">🔊</button></div><div class="w">
<h1>💕 Game Berdua</h1><p class="sub">Satu layar, dua hati, banyak keseruan 💞</p>
<div class="pl"><input id="n0" placeholder="💗 Nama kamu" maxlength="14" oninput="upd()"><input id="n1" placeholder="💜 Nama pasangan" maxlength="14" oninput="upd()"></div>
<div id="sc"></div>
<div class="menu" id="menu"></div>
<section id="game" hidden>
<div class="bar"><button class="btn l" id="back">← Menu</button><h2 id="gt"></h2><button class="btn l" id="re">↻ Ulang</button></div>
<div id="st"></div><div id="board"></div><div id="acts"></div>
</section><footer class="ft">Dibuat oleh Aspuro dan Gina</footer></div>
<script>
const $=s=>document.querySelector(s),E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e},
esc=s=>s.replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),
N=i=>$('#n'+i).value.trim()||'Pemain '+(i+1),
sh=a=>[...a].sort(()=>Math.random()-.5);
let sc=[0,0],stop=null,cur;
const upd=()=>$('#sc').innerHTML=`<b style="color:var(--p1)">${esc(N(0))} ${sc[0]}</b> 💞 <b style="color:var(--p2)">${sc[1]} ${esc(N(1))}</b> <button class="btn l" style="padding:2px 8px" onclick="sc=[0,0];upd()">↺</button>`,
st=(t,i)=>{const s=$('#st');s.textContent=t;s.style.color=i==null?'':`var(--p${i+1})`},
win=i=>{sc[i]++;upd();cele(i)},
act=(l,f)=>{const a=$('#acts');a.innerHTML='';if(l){const e=E('button','btn',l);e.onclick=f;a.append(e)}};

function xo(b){
 const c=Array(9).fill(null),L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];let t=0,over=0;b.className='g3';
 const bt=c.map((_,i)=>{const e=E('button','cell');e.onclick=()=>{if(over||c[i]!==null)return;c[i]=t;e.textContent=t?'⭕':'❌';e.style.color=`var(--p${t+1})`;
  const w=L.find(l=>l.every(j=>c[j]===t));
  if(w){over=1;w.forEach(j=>bt[j].classList.add('hl'));st(N(t)+' menang! 🎉',t);win(t);act('Main lagi',run)}
  else if(c.every(x=>x!==null)){over=1;st('Seri! 🤝');act('Main lagi',run)}
  else{t=1-t;st('Giliran '+N(t),t)}};b.append(e);return e});
 st('Giliran '+N(0),0)}

function c4(b){
 const R=6,C=7,g=Array.from({length:R},()=>Array(C).fill(-1)),cs=[];let t=0,over=0;b.className='g7';
 for(let r=0;r<R;r++)for(let c=0;c<C;c++){const e=E('button','cell');e.onclick=()=>drop(c);b.append(e);cs.push(e)}
 const chk=(r,c)=>[[0,1],[1,0],[1,1],[1,-1]].some(([dr,dc])=>{const l=[[r,c]];for(const s of[1,-1]){let y=r+dr*s,x=c+dc*s;while(g[y]?.[x]===t){l.push([y,x]);y+=dr*s;x+=dc*s}}if(l.length>=4){l.forEach(([y,x])=>cs[y*C+x].classList.add('hl'));return true}});
 function drop(c){if(over)return;let r=R-1;while(r>=0&&g[r][c]!==-1)r--;if(r<0)return;g[r][c]=t;cs[r*C+c].style.background=`var(--p${t+1})`;
  if(chk(r,c)){over=1;st(N(t)+' menang! 🎉',t);win(t);act('Main lagi',run)}
  else if(g[0].every(x=>x!==-1)){over=1;st('Seri! 🤝');act('Main lagi',run)}
  else{t=1-t;st('Giliran '+N(t),t)}}
 st('Giliran '+N(0)+' · ketuk kolom',0)}

function mem(b){
 b.className='g4';const e8=['🍕','🐱','🌸','🚀','🍦','🎸','🌙','🦋'],d=sh([...e8,...e8]);let t=0,o=[],lk=0,p=[0,0],left=8;
 const info=()=>st(`Giliran ${N(t)} · ${p[0]}–${p[1]}`,t);
 const bt=d.map((v,i)=>{const e=E('button','cell card');e.onclick=()=>{if(lk||o.includes(i)||e.classList.contains('ok'))return;e.textContent=v;e.classList.add('up');o.push(i);if(o.length<2)return;const[a,c]=o;
  if(d[a]==d[c]){bt[a].classList.add('ok');bt[c].classList.add('ok');p[t]++;o=[];
   if(--left)info();else{const w=p[0]==p[1]?-1:+(p[1]>p[0]);if(w<0)st(`Seri ${p[0]}–${p[1]}! 🤝`);else{st(`${N(w)} menang ${p[w]}–${p[1-w]}! 🎉`,w);win(w)}act('Main lagi',run)}}
  else{lk=1;setTimeout(()=>{for(const j of[a,c]){bt[j].textContent='';bt[j].classList.remove('up')}o=[];lk=0;t=1-t;info()},900)}};b.append(e);return e});
 info()}

function rx(b){
 let s=3,tm,p=[0,0];b.className='gp';
 const pads=[0,1].map(i=>{const e=E('button','pad',`<small>${esc(N(i))} (${i?'L':'A'})</small>Tap!`);e.style.setProperty('--c',`var(--p${i+1})`);e.onpointerdown=()=>hit(i);b.append(e);return e});
 const fin=(w,m='')=>{s=3;clearTimeout(tm);pads.forEach(x=>x.classList.remove('go'));p[w]++;
  if(p[w]==3){st(`${N(w)} juara! 🏆 ${p[0]}–${p[1]}`,w);win(w);act('Main lagi',run)}
  else{st(`${m} Poin ${N(w)}! ${p[0]}–${p[1]}`,w);act('Ronde berikutnya',go)}};
 const hit=i=>{if(s==1)fin(i);else if(s==0)fin(1-i,N(i)+' kecepatan 😅')};
 const go=()=>{s=0;act();st('Siap-siap… tunggu hijau!');tm=setTimeout(()=>{s=1;pads.forEach(x=>x.classList.add('go'));st('SEKARANG! ⚡')},1500+Math.random()*3000)};
 const kd=e=>{if(e.repeat)return;const k=e.key.toLowerCase();if(k=='a')hit(0);if(k=='l')hit(1)};
 addEventListener('keydown',kd);stop=()=>{clearTimeout(tm);removeEventListener('keydown',kd)};
 st('Duluan 3 poin! Tap saat hijau, jangan kepagian.');act('Mulai',go)}

function rps(b){
 const o=['✊','✋','✌️'];let t=0,pk=[],p=[0,0];
 const draw=()=>{b.innerHTML='';b.className='';const r=E('div','row');o.forEach((x,i)=>{const e=E('button','btn',x);e.onclick=()=>pick(i);r.append(e)});b.append(r);
  st(`${N(t)}, pilih diam-diam 🙈 (${p[0]}–${p[1]})`,t);act()};
 const pick=i=>{pk[t]=i;if(t==0){t=1;draw();return}t=0;
  const d=(pk[0]-pk[1]+3)%3,w=d==0?-1:d==1?0:1;b.innerHTML=`<div class="rv">${o[pk[0]]} <small>vs</small> ${o[pk[1]]}</div>`;
  if(w<0){st('Seri! 🤝');act('Ronde berikutnya',draw)}
  else{p[w]++;if(p[w]==3){st(`${N(w)} juara suit! 🏆`,w);win(w);act('Main lagi',run)}else{st(`${N(w)} menang ronde! (${p[0]}–${p[1]})`,w);act('Ronde berikutnya',draw)}}};
 draw()}
